---
name: C++

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  cpp:
    name: C++
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy libgtest-dev

      - name: Run linter (clang-tidy)
        run: |
          ./scripts/lint.sh cpp

      - name: Check formatting (clang-format)
        run: |
          ./scripts/format.sh cpp
          if ! git diff --exit-code; then
            echo "C++ formatting issues found. Run './scripts/format.sh cpp' locally."
            exit 1
          fi

      - name: Run tests (Bazel)
        run: |
          bazel test --test_tag_filters=cc //problems/...
